<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="ChargeWatch: when one phone charges, the other gets a notification at 80% and when it is full">
<title>ChargeWatch: know when your other phone is charged</title>
<style>
  .serif { font-family: 'Libre Baskerville', Georgia, 'Times New Roman', serif; }
  .sans { font-family: Poppins, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; }
  /* 9 s loop: 0-36% charge to 80, 40% alert one, 40-68% charge to 100, 72% alert two. */
  .fill { transform-box: fill-box; transform-origin: left center; animation: fill 9s ease-in-out infinite; }
  @keyframes fill {
    0% { transform: scaleX(0.45); } 36% { transform: scaleX(0.8); } 40% { transform: scaleX(0.8); }
    68% { transform: scaleX(1); } 95% { transform: scaleX(1); } 100% { transform: scaleX(0.45); }
  }
  .p45 { animation: p45 9s linear infinite; }
  .p80 { animation: p80 9s linear infinite; }
  .p100 { animation: p100 9s linear infinite; }
  @keyframes p45 { 0%, 30% { opacity: 1; } 33%, 97% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes p80 { 0%, 33% { opacity: 0; } 36%, 62% { opacity: 1; } 65%, 100% { opacity: 0; } }
  @keyframes p100 { 0%, 65% { opacity: 0; } 68%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
  .bolt { animation: bolt 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bolt { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .pulse { animation: pulse 9s linear infinite; }
  @keyframes pulse {
    0%, 35% { transform: translateX(0); opacity: 0; } 36% { opacity: 1; } 40% { transform: translateX(78px); opacity: 1; }
    41%, 67% { transform: translateX(0); opacity: 0; } 68% { opacity: 1; } 72% { transform: translateX(78px); opacity: 1; }
    73%, 100% { transform: translateX(0); opacity: 0; }
  }
  .n1 { animation: n1 9s ease-out infinite; }
  .n2 { animation: n2 9s ease-out infinite; }
  @keyframes n1 {
    0%, 40% { transform: translateY(-14px); opacity: 0; } 43%, 63% { transform: translateY(0); opacity: 1; }
    66%, 100% { transform: translateY(-14px); opacity: 0; }
  }
  @keyframes n2 {
    0%, 72% { transform: translateY(-14px); opacity: 0; } 75%, 95% { transform: translateY(0); opacity: 1; }
    98%, 100% { transform: translateY(-14px); opacity: 0; }
  }
  .wire { animation: wire 1.2s linear infinite; }
  @keyframes wire { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) {
    .fill, .p45, .p80, .p100, .bolt, .pulse, .n1, .n2, .wire { animation: none; }
    .p45, .p100, .n1 { opacity: 0; } .p80, .n2 { opacity: 1; }
  }
</style>
<defs>
  <radialGradient id="glow" cx="78%" cy="20%" r="60%">
    <stop offset="0" stop-color="#FEF3C7" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1" dy="2" stdDeviation="6" flood-color="#4B1111" flood-opacity="0.14"/>
  </filter>
</defs>
<rect width="880" height="340" rx="20" fill="#FAF7F5"/>
<rect width="880" height="340" rx="20" fill="url(#glow)"/>

<!-- What it is -->
<text x="44" y="104" class="sans" font-size="12" font-weight="600" letter-spacing="2.2" fill="#805500">ANDROID · FREE · OPEN SOURCE</text>
<text x="42" y="160" class="serif" font-size="50" font-weight="700" fill="#1A1A1A">ChargeWatch</text>
<text x="44" y="200" class="sans" font-size="19" fill="#57534E">Know when your other phone is charged.</text>
<text x="44" y="226" class="sans" font-size="15" fill="#57534E">Alerts at 80% and at 100%, on the phone in your hand.</text>
<g class="sans" font-size="13" font-weight="500">
  <rect x="44" y="250" width="106" height="30" rx="15" fill="#FDF2D6" stroke="#F5E8D2"/>
  <text x="97" y="270" text-anchor="middle" fill="#805500">QR pairing</text>
  <rect x="160" y="250" width="110" height="30" rx="15" fill="#FDF2D6" stroke="#F5E8D2"/>
  <text x="215" y="270" text-anchor="middle" fill="#805500">No account</text>
  <rect x="280" y="250" width="96" height="30" rx="15" fill="#FDF2D6" stroke="#F5E8D2"/>
  <text x="328" y="270" text-anchor="middle" fill="#805500">&lt; 500 KB</text>
</g>

<!-- Phone 1: charging -->
<g filter="url(#shadow)">
  <rect x="452" y="40" width="150" height="262" rx="24" fill="#1A1A1A"/>
  <rect x="459" y="47" width="136" height="248" rx="18" fill="#FAF7F5"/>
</g>
<text x="527" y="86" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#1A1A1A">Poco X8</text>
<g transform="translate(482 112)">
  <rect x="0" y="0" width="80" height="42" rx="10" fill="none" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="83" y="13" width="6" height="16" rx="2" fill="#1A1A1A"/>
  <rect class="fill" x="6" y="6" width="68" height="30" rx="5" fill="#B45309"/>
  <path class="bolt" d="M43 9 L31 23 H39 L35 33 L48 18 H40 Z" fill="#FAF7F5" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
</g>
<g class="serif" font-size="30" font-weight="700" fill="#1A1A1A" text-anchor="middle">
  <text class="p45" x="527" y="196">45%</text>
  <text class="p80" x="527" y="196">80%</text>
  <text class="p100" x="527" y="196">100%</text>
</g>
<circle cx="497" cy="222" r="4" fill="#B45309"/>
<text x="507" y="226" class="sans" font-size="12" fill="#57534E">Charging</text>
<path class="wire" d="M527 302 V332" stroke="#57534E" stroke-width="3" stroke-dasharray="6 6" fill="none"/>

<!-- The relay between them -->
<line x1="610" y1="160" x2="692" y2="160" stroke="#F5E8D2" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
<circle class="pulse" cx="612" cy="160" r="6" fill="#9B2C2C"/>
<text x="651" y="186" text-anchor="middle" class="mono" font-size="10" fill="#57534E">ntfy relay</text>

<!-- Phone 2: the one in your hand -->
<g filter="url(#shadow)">
  <rect x="698" y="40" width="150" height="262" rx="24" fill="#1A1A1A"/>
  <rect x="705" y="47" width="136" height="248" rx="18" fill="#FAF7F5"/>
</g>
<text x="773" y="96" text-anchor="middle" class="sans" font-size="34" font-weight="300" fill="#1A1A1A">1:03</text>
<text x="773" y="116" text-anchor="middle" class="sans" font-size="10" fill="#57534E">Tue, 10 Nov</text>
<g class="n1">
  <rect x="712" y="134" width="122" height="54" rx="10" fill="#FFFFFF" stroke="#F5E8D2"/>
  <rect x="720" y="144" width="16" height="16" rx="4" fill="#9B2C2C"/>
  <text x="728" y="156" text-anchor="middle" class="sans" font-size="7" font-weight="700" fill="#FFFFFF">CW</text>
  <text x="742" y="155" class="sans" font-size="11" font-weight="600" fill="#1A1A1A">Poco X8 is 80%</text>
  <text x="742" y="172" class="sans" font-size="10" fill="#57534E">Still charging</text>
</g>
<g class="n2">
  <rect x="712" y="134" width="122" height="54" rx="10" fill="#FFFFFF" stroke="#F5E8D2"/>
  <rect x="720" y="144" width="16" height="16" rx="4" fill="#9B2C2C"/>
  <text x="728" y="156" text-anchor="middle" class="sans" font-size="7" font-weight="700" fill="#FFFFFF">CW</text>
  <text x="742" y="155" class="sans" font-size="11" font-weight="600" fill="#1A1A1A">Poco X8 is full</text>
  <text x="742" y="172" class="sans" font-size="10" fill="#57534E">You can use it now.</text>
</g>
<text x="773" y="282" text-anchor="middle" class="sans" font-size="10" fill="#57534E">the phone in your hand</text>
</svg>
