name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (wrapper pins Gradle 8.9)
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and release build
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Check APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ChargeWatch.apk
          size=$(stat -c %s ChargeWatch.apk)
          mb=$(awk "BEGIN { printf \"%.2f\", $size / 1048576 }")
          echo "APK size: $size bytes ($mb MB)"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          {
            echo "### ChargeWatch.apk"
            echo ""
            echo "Size: **$mb MB** ($size bytes). Limit: 5 MB."
            echo ""
            echo '```'
            "$tools/aapt2" dump badging ChargeWatch.apk | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" || true
            echo '```'
            echo ""
            echo "Signature:"
            echo '```'
            "$tools/apksigner" verify --print-certs ChargeWatch.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 5242880 ]; then
            echo "::error::ChargeWatch.apk is $mb MB, over the 5 MB limit"
            exit 1
          fi
          # Fail the build if the signature does not verify, and show the schemes in the log.
          "$tools/apksigner" verify --verbose --min-sdk-version 26 ChargeWatch.apk | grep -E "^Verifie|^Number of signers|WARNING|ERROR" || true
          "$tools/apksigner" verify --min-sdk-version 26 ChargeWatch.apk
          # Some browsers and phone security apps hold back .apk downloads. A zip is a fallback.
          zip -j -9 ChargeWatch.zip ChargeWatch.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: ChargeWatch-apk
          path: |
            ChargeWatch.apk
            ChargeWatch.zip
          if-no-files-found: error

  emulator-test:
    name: Install and run on Android 14
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Download the APK from the build job
        uses: actions/download-artifact@v5
        with:
          name: ChargeWatch-apk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 .github/scripts/emulator_test.py ChargeWatch.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-screenshots
          path: emulator-*.png
          if-no-files-found: ignore

  release:
    name: Publish to the "latest" release
    # Only builds that passed the emulator test reach users, including through in-app updates.
    needs: [build, emulator-test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Download the APK
        uses: actions/download-artifact@v5
        with:
          name: ChargeWatch-apk

      - name: Download the screenshots
        uses: actions/download-artifact@v5
        with:
          name: emulator-screenshots

      - name: Publish
        run: |
          # Fold the current files' download counts into the running total before replacing them.
          baseline=$(python3 .github/scripts/release_info.py baseline)
          echo "Downloads so far: $baseline"
          git tag -f latest
          git push -f origin refs/tags/latest
          notes="Automatic build of $(git rev-parse --short HEAD) from main ($(date -u '+%Y-%m-%d %H:%M UTC')). Tested on an Android 14 emulator before release.

          Download **ChargeWatch.apk** below and open it on your phone to install. If your browser gets stuck at 100%, download **ChargeWatch.zip** instead, open it in your Files app and tap the APK inside. Installed copies update themselves from inside the app."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "ChargeWatch (latest build)" --notes "$notes" --latest
          else
            gh release create latest --title "ChargeWatch (latest build)" --notes "$notes" --latest
          fi
          for f in emulator-*.png; do cp "$f" "screenshot-${f#emulator-}"; done
          gh release upload latest ChargeWatch.apk ChargeWatch.zip screenshot-*.png --clobber
          # version.json goes last, so it never points at an APK that is not uploaded yet.
          python3 .github/scripts/release_info.py write ChargeWatch.apk "$baseline"
          gh release upload latest version.json --clobber
